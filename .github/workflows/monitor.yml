name: Monitoring Sites Albys

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      run_psi:
        description: "Lancer PageSpeed Insights (plus long)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer le monitoring des sites
        env:
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_SUPPORT:     ${{ secrets.EMAIL_SUPPORT }}
          EMAIL_AXEL:        ${{ secrets.EMAIL_AXEL }}
          EMAIL_TEST:        ${{ secrets.EMAIL_TEST }}
          PSI_API_KEY:       ${{ secrets.PSI_API_KEY }}
          BACKUP_STATUS_URL: ${{ secrets.BACKUP_STATUS_URL }}
        run: |
          if [ "${{ github.event.inputs.run_psi }}" = "true" ] || [ -n "$PSI_API_KEY" ]; then
            python monitor.py --psi
          else
            python monitor.py
          fi

      - name: Lancer le monitoring Gandi
        env:
          GANDI_API_KEY: ${{ secrets.GANDI_API_KEY }}
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SUPPORT: ${{ secrets.EMAIL_SUPPORT }}
          EMAIL_AXEL:    ${{ secrets.EMAIL_AXEL }}
        run: python gandi_monitor.py

      - name: Generer le dashboard statique
        run: python build_static.py

      - name: Sauvegarder les resultats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json results_gandi.json history.db inventaire_monitoring.xlsx monitor.log || true
          git diff --cached --quiet || git commit -m "chore: monitoring $(date +'%d/%m/%Y %H:%M')"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy sur GitHub Pages
        uses: actions/deploy-pages@v4
